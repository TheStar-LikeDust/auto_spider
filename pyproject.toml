[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-spider"
version = "0.1.0"
description = "简单高效的三阶段网页爬虫框架"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "TheStar-LikeDust"}
]
maintainers = [
    {name = "TheStar-LikeDust"}
]
keywords = ["scraping", "crawler", "automation", "web"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
requires-python = ">=3.8"

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]
all = [
    "auto-spider[browser]",
]

[project.urls]
Homepage = "https://github.com/TheStar-LikeDust/auto_spider"
Repository = "https://github.com/TheStar-LikeDust/auto_spider.git"
Issues = "https://github.com/TheStar-LikeDust/auto_spider/issues"

[project.scripts]
auto-spider = "auto_spider.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["auto_spider*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
auto_spider = [
    "py.typed",
    "skills/**/*.md",
    "docs/*.md",
]